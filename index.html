<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narkoba: Jalan salah menuju kesenangan sementara</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        dark: '#0B0F17',
                        card: '#161F30',
                        accent: '#E63946',
                        gold: '#D4AF37',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0B0F17;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .slide-enter {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glow-effect {
            box-shadow: 0 0 30px rgba(230, 57, 70, 0.12);
        }

        .glow-accent {
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.35);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0B0F17;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1E293B;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between custom-scrollbar selection:bg-red-500 selection:text-white">

    <!-- Top Navigation Header -->
    <header class="border-b border-slate-800/80 bg-slate-950/60 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-full bg-red-600/20 border border-red-500/40 flex items-center justify-center text-red-500">
                    <i data-lucide="brain-circuit" class="w-4 h-4"></i>
                </div>
                <span class="font-semibold text-slate-200 tracking-wide text-sm sm:text-base">Narkoba & Kehidupan Manusia</span>
            </div>
            <div id="progress-indicator" class="text-xs font-medium px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">
                Langkah <span id="current-step-num">1</span> dari 5
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-3xl mx-auto px-4 py-8 sm:py-10 flex-grow flex flex-col justify-center w-full">
        
        <!-- Interactive Step Content Cards -->
        <div id="card-container" class="relative">
            <!-- Dynamic Content Injected via JavaScript -->
        </div>

    </main>

    <!-- Bottom Interactive Control Bar -->
    <footer class="border-t border-slate-800/80 bg-slate-950/80 backdrop-blur-md py-4 px-4 sticky bottom-0 z-50">
        <div class="max-w-3xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            
            <!-- Timeline Indicator Dots -->
            <div class="flex items-center space-x-2" id="dots-container">
                <!-- Dots generated by JS -->
            </div>

            <!-- Navigation Buttons -->
            <div class="flex items-center space-x-3 w-full sm:w-auto">
                <button id="btn-prev" onclick="prevStep()" class="flex-1 sm:flex-initial px-5 py-2.5 rounded-xl border border-slate-700 bg-slate-900/80 hover:bg-slate-800 text-slate-300 transition-all duration-200 text-sm font-medium disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center space-x-2">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Kembali</span>
                </button>
                <button id="btn-next" onclick="nextStep()" class="flex-1 sm:flex-initial px-6 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white font-medium transition-all duration-200 text-sm glow-accent flex items-center justify-center space-x-2">
                    <span id="btn-next-text">Lanjut</span>
                    <i data-lucide="arrow-right" class="w-4 h-4" id="btn-next-icon"></i>
                </button>
            </div>
        </div>
    </footer>

    <!-- Logic JavaScript -->
    <script>
        const topics = [
            {
                id: 1,
                tag: "Bagian 1: Pengertian dasar",
                simpleQuestion: "“Sebenarnya barang seperti apa sih narkoba itu, dan kenapa begitu orang mencoba, pikirannya bisa langsung ketagihan?”",
                title: "Jalan pintas yang membodohi otak",
                icon: "sparkles",
                color: "from-amber-500/20 to-red-500/10",
                badgeColor: "text-amber-400 border-amber-500/30 bg-amber-500/10",
                isQuote: false,
                content: `
                    <p class="text-slate-300 leading-relaxed mb-4 text-base">
                        Secara sederhana, narkoba itu ibarat <strong class="text-white font-semibold">jalan pintas palsu</strong>. Otak manusia itu sebenarnya sudah punya cara alami untuk membuat kita merasa senang—misalnya saat makan enak, dipeluk keluarga, atau berhasil mencapai cita-cita.
                    </p>
                    <div class="bg-slate-900/90 border-l-4 border-amber-500 p-4 rounded-r-xl my-4 space-y-2">
                        <p class="text-sm text-slate-300">
                            Narkoba masuk dan <strong class="text-slate-100">memaksa otak mengeluarkan rasa senang itu secara berlebihan dan instan</strong>, tanpa perlu ada usaha. Akibatnya, otak kaget dan menjadi bingung.
                        </p>
                    </div>
                    <p class="text-slate-300 leading-relaxed text-base">
                        Lama-lama, otak lupa caranya merasa senang dari hal-hal yang biasa. Penggunanya mulai merasa dunia nyata itu membosankan atau menyiksa, kecuali kalau mereka sedang memakai zat tersebut.
                    </p>
                `
            },
            {
                id: 2,
                tag: "Bagian 2: Alasan utama",
                simpleQuestion: "“Padahal sudah tahu bahaya dan bisa merusak hidup, kenapa masih ada saja orang yang nekad mencoba?”",
                title: "Melarikan diri dari rasa sakit",
                icon: "heart-crack",
                color: "from-red-500/20 to-purple-500/10",
                badgeColor: "text-red-400 border-red-500/30 bg-red-500/10",
                isQuote: false,
                content: `
                    <p class="text-slate-300 leading-relaxed mb-4 text-base">
                        Jarang sekali ada orang yang berniat menghancurkan hidupnya sendiri sejak awal. Sebagian besar orang terjerat karena mencari <strong class="text-white font-semibold">obat bius untuk rasa sakit di hatinya</strong>.
                    </p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 my-4">
                        <div class="p-3.5 bg-slate-900/60 border border-slate-800 rounded-xl">
                            <h4 class="text-red-400 font-medium text-sm mb-1 flex items-center gap-1.5">
                                <i data-lucide="shield-alert" class="w-4 h-4"></i> Beban batin
                            </h4>
                            <p class="text-xs text-slate-400">Trauma masa lalu, stres pekerjaan, atau rasa sedih mendalam yang tidak tahu harus diselesaikan bagaimana.</p>
                        </div>
                        <div class="p-3.5 bg-slate-900/60 border border-slate-800 rounded-xl">
                            <h4 class="text-purple-400 font-medium text-sm mb-1 flex items-center gap-1.5">
                                <i data-lucide="compass" class="w-4 h-4"></i> Perasaan hampa
                            </h4>
                            <p class="text-xs text-slate-400">Merasa hidup tidak ada gunanya, kesepian, atau tidak punya arah tujuan yang jelas.</p>
                        </div>
                    </div>
                    <p class="text-slate-300 leading-relaxed text-base">
                        Sebenarnya mereka bukan ingin merusak tubuhnya dengan racun. Mereka hanya <strong class="text-slate-100">ingin istirahat sejenak dari penderitaan hidup</strong> yang terasa terlalu berat untuk ditanggung sendiri.
                    </p>
                `
            },
            {
                id: 3,
                tag: "Bagian 3: Jebakan adiksi",
                simpleQuestion: "“Kalau sudah terlanjur ketagihan, kenapa sulit sekali untuk berhenti? Apakah mereka kurang niat?”",
                title: "Ketika diri sendiri tak lagi memegang kendali",
                icon: "lock",
                color: "from-purple-500/20 to-blue-500/10",
                badgeColor: "text-purple-400 border-purple-500/30 bg-purple-500/10",
                isQuote: false,
                content: `
                    <p class="text-slate-300 leading-relaxed mb-4 text-base">
                        Ini bukan cuma masalah "niat" atau "kurang kuat iman". Ketika seseorang sudah kecanduan, <strong class="text-white font-semibold">fisik dan otaknya sudah terlanjur rusak</strong>.
                    </p>
                    <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-xl my-4">
                        <div class="flex items-start space-x-3">
                            <div class="p-2 bg-red-500/10 text-red-400 rounded-lg shrink-0 mt-0.5">
                                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h4 class="text-slate-200 font-semibold text-sm">Narkoba mengubah aturan main</h4>
                                <p class="text-xs text-slate-400 mt-1 leading-relaxed">
                                    Pecandu tidak lagi memakai narkoba untuk merasa gaya atau senang. Mereka memakai zat itu hanya agar badan tidak terasa kesakitan hebat (sakau) dan bisa berfungsi layaknya orang biasa.
                                </p>
                            </div>
                        </div>
                    </div>
                    <p class="text-slate-300 leading-relaxed text-base">
                        Awalnya manusia yang memilih untuk mencoba. Namun pada akhirnya, <strong class="text-slate-100">zat itulah yang gantian mengatur dan memerintah hidup manusia tersebut</strong>. Kebebasan dirinya telah terampas.
                    </p>
                `
            },
            {
                id: 4,
                tag: "Bagian 4: Jalan keluar",
                simpleQuestion: "“Lalu bagaimana caranya agar seseorang yang sudah terjerat bisa benar-benar sembuh total?”",
                title: "Menyembuhkan hati dan menemukan tujuan hidup",
                icon: "sun",
                color: "from-emerald-500/20 to-teal-500/10",
                badgeColor: "text-emerald-400 border-emerald-500/30 bg-emerald-500/10",
                isQuote: false,
                content: `
                    <p class="text-slate-300 leading-relaxed mb-4 text-base">
                        Membersihkan racun dari dalam tubuh secara medis itu baru langkah awal. Tantangan terbesarnya adalah <strong class="text-white font-semibold">menyembuhkan alasan awal kenapa dulu ia kabur ke narkoba</strong>.
                    </p>
                    <div class="space-y-2 my-4">
                        <div class="flex items-center space-x-3 p-3 bg-slate-900/60 rounded-lg border border-slate-800">
                            <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400 shrink-0"></i>
                            <span class="text-sm text-slate-200">Selesaikan masalah atau luka hati yang belum pernah diobati.</span>
                        </div>
                        <div class="flex items-center space-x-3 p-3 bg-slate-900/60 rounded-lg border border-slate-800">
                            <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400 shrink-0"></i>
                            <span class="text-sm text-slate-200">Bantu dia menemukan kembali alasan dan gunanya dia hidup di dunia ini.</span>
                        </div>
                    </div>
                    <p class="text-slate-300 leading-relaxed text-base">
                        Seseorang baru benar-benar bebas ketika ia sudah <strong class="text-slate-100">berani menghadapi kenyataan hidup—seberat apa pun itu—tanpa perlu membius dirinya sendiri</strong>.
                    </p>
                `
            },
            {
                id: 5,
                tag: "Bagian 5: Renungan",
                simpleQuestion: "",
                title: "Catatan untuk diri kita",
                icon: "feather",
                color: "from-amber-500/10 to-red-500/20",
                badgeColor: "text-amber-400 border-amber-500/30 bg-amber-500/10",
                isQuote: true,
                content: `
                    <div class="py-6 sm:py-8 text-center flex flex-col items-center justify-center">
                        <div class="w-12 h-12 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center text-amber-400 mb-6">
                            <i data-lucide="quote" class="w-5 h-5"></i>
                        </div>
                        <blockquote class="font-serif text-slate-200 text-lg sm:text-2xl leading-relaxed max-w-xl mb-6">
                            “Narkoba tidak pernah menyelesaikan rasa sakit, ia hanya menundanya—sambil diam-diam mengambil seluruh kebebasan yang kamu miliki.”
                        </blockquote>
                        <p class="text-slate-400 text-sm max-w-md leading-relaxed">
                            Setiap manusia berhak atas rasa tenang dan kebahagiaan yang nyata, bukan yang dipinjam secara paksa dari obat bius buatan.
                        </p>
                    </div>
                `
            }
        ];

        let currentStep = 0;

        function renderCard() {
            const topic = topics[currentStep];
            const container = document.getElementById('card-container');
            
            let questionBlock = '';
            if (!topic.isQuote && topic.simpleQuestion) {
                questionBlock = `
                    <div class="mb-6 p-4 sm:p-5 rounded-xl bg-slate-950/80 border border-slate-800/80 relative">
                        <div class="text-xs font-semibold text-red-400/90 tracking-wide mb-1.5 flex items-center gap-1.5">
                            <i data-lucide="help-circle" class="w-4 h-4 text-red-400"></i>
                            Pertanyaan yang sering muncul:
                        </div>
                        <h2 class="font-sans text-base sm:text-lg text-slate-100 font-medium leading-snug">
                            ${topic.simpleQuestion}
                        </h2>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="slide-enter">
                    <div class="bg-card border border-slate-800 rounded-2xl p-6 sm:p-8 glow-effect relative overflow-hidden">
                        
                        <div class="absolute -top-24 -left-24 w-48 h-48 bg-gradient-to-br ${topic.color} rounded-full blur-3xl pointer-events-none"></div>

                        <!-- Header Tag & Badge -->
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-5">
                            <span class="text-xs font-medium tracking-wide px-3 py-1 rounded-full border ${topic.badgeColor}">
                                ${topic.tag}
                            </span>
                            <div class="flex items-center space-x-1 text-slate-500 text-xs">
                                <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                                <span>Estimasi baca: 1 menit</span>
                            </div>
                        </div>

                        ${questionBlock}

                        <!-- Judul Materi -->
                        ${!topic.isQuote ? `
                        <div class="flex items-center space-x-3 mb-4">
                            <div class="p-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-200">
                                <i data-lucide="${topic.icon}" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                            </div>
                            <h3 class="text-lg sm:text-2xl font-bold text-slate-50 tracking-tight">
                                ${topic.title}
                            </h3>
                        </div>
                        ` : ''}

                        <!-- Isi Penjelasan / Quote -->
                        <div class="prose prose-invert max-w-none">
                            ${topic.content}
                        </div>

                    </div>
                </div>
            `;

            document.getElementById('current-step-num').innerText = currentStep + 1;
            document.getElementById('btn-prev').disabled = currentStep === 0;
            
            const nextBtnText = document.getElementById('btn-next-text');
            const nextBtnIcon = document.getElementById('btn-next-icon');
            
            if (currentStep === topics.length - 1) {
                nextBtnText.innerText = "Ulangi";
                nextBtnIcon.setAttribute('data-lucide', 'rotate-ccw');
            } else {
                nextBtnText.innerText = "Lanjut";
                nextBtnIcon.setAttribute('data-lucide', 'arrow-right');
            }

            renderDots();
            lucide.createIcons();
        }

        function renderDots() {
            const container = document.getElementById('dots-container');
            container.innerHTML = topics.map((_, index) => {
                const isActive = index === currentStep;
                return `
                    <button 
                        onclick="goToStep(${index})"
                        class="h-2.5 rounded-full transition-all duration-300 ${isActive ? 'w-8 bg-red-500' : 'w-2.5 bg-slate-800 hover:bg-slate-700'}"
                        title="Ke Bagian ${index + 1}"
                    ></button>
                `;
            }).join('');
        }

        function nextStep() {
            if (currentStep < topics.length - 1) {
                currentStep++;
            } else {
                currentStep = 0;
            }
            renderCard();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderCard();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function goToStep(index) {
            currentStep = index;
            renderCard();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderCard();
        });
    </script>
</body>
</html>
